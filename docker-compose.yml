services:
  postgres:
    image: postgres:16-alpine
    container_name: adtrack-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: adtrack
      POSTGRES_PASSWORD: adtrack_dev_password
      POSTGRES_DB: adtrack
    ports:
      - "5432:5432"
    volumes:
      - adtrack_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adtrack"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: adtrack-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - adtrack_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  adtrack_postgres_data:
  adtrack_redis_data:
